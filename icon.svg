<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgR17" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2D0B58" />
      <stop offset="65%" stop-color="#120428" />
      <stop offset="100%" stop-color="#050012" />
    </radialGradient>

    <!-- Chrome Gradient with Sharp Horizon Line -->
    <linearGradient id="chrome17" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="38%" stop-color="#CDE7FF" />
      <stop offset="49%" stop-color="#214A75" />
      <stop offset="51%" stop-color="#0E162A" />
      <stop offset="72%" stop-color="#8E2D9C" />
      <stop offset="90%" stop-color="#FF38BF" />
      <stop offset="100%" stop-color="#FFA8EE" />
    </linearGradient>

    <!-- Synthwave Sun Gradient -->
    <linearGradient id="sunGrad17" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF275" />
      <stop offset="50%" stop-color="#FF2E93" />
      <stop offset="100%" stop-color="#7B00FF" />
    </linearGradient>

    <!-- Neon Arrow Gradient -->
    <linearGradient id="arrowGrad17" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00FFFF" />
      <stop offset="60%" stop-color="#00C8FF" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <clipPath id="circleClip17">
      <circle cx="256" cy="256" r="236" />
    </clipPath>

    <!-- Glow Filters -->
    <filter id="neonGlow17" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="sparksGlow17" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Outer Badge -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="#FF00A0" stroke-width="5" opacity="0.65" filter="url(#neonGlow17)" />
  <circle cx="256" cy="256" r="236" fill="url(#bgR17)" stroke="#00FFFF" stroke-width="4" />

  <!-- Horizontal Scanlines Background -->
  <g clip-path="url(#circleClip17)" opacity="0.32">
    <line x1="20" y1="46" x2="492" y2="46" stroke="#00FFFF" stroke-width="2" />
    <line x1="20" y1="68" x2="492" y2="68" stroke="#00FFFF" stroke-width="2" />
    <line x1="20" y1="90" x2="492" y2="90" stroke="#00FFFF" stroke-width="2" />
    <line x1="20" y1="112" x2="492" y2="112" stroke="#00FFFF" stroke-width="2" />
    <line x1="20" y1="134" x2="492" y2="134" stroke="#00FFFF" stroke-width="2" />
    <line x1="20" y1="156" x2="492" y2="156" stroke="#00FFFF" stroke-width="2" />
    <line x1="20" y1="178" x2="492" y2="178" stroke="#00FFFF" stroke-width="2" />
    <line x1="20" y1="200" x2="492" y2="200" stroke="#00FFFF" stroke-width="2" />
    <line x1="20" y1="222" x2="492" y2="222" stroke="#00FFFF" stroke-width="2" />
    <line x1="20" y1="244" x2="492" y2="244" stroke="#00FFFF" stroke-width="2" />
  </g>

  <!-- STRIPED SYNTHWAVE SUN ON THE HORIZON -->
  <g clip-path="url(#circleClip17)" transform="translate(256, 230)">
    <path d="M -95,0 A 95,95 0 0,1 95,0 L 95,14 L -95,14 Z" fill="url(#sunGrad17)" opacity="0.85" />
    <path d="M -94,20 L 94,20 L 89,35 L -89,35 Z" fill="url(#sunGrad17)" opacity="0.85" />
    <path d="M -85,42 L 85,42 L 78,56 L -78,56 Z" fill="url(#sunGrad17)" opacity="0.85" />
  </g>

  <!-- NEON PERSPECTIVE GRID FLOOR -->
  <g clip-path="url(#circleClip17)" opacity="0.5" filter="url(#neonGlow17)">
    <line x1="20" y1="290" x2="492" y2="290" stroke="#FF00A0" stroke-width="2" />
    <line x1="20" y1="320" x2="492" y2="320" stroke="#00FFFF" stroke-width="2" />
    <line x1="20" y1="360" x2="492" y2="360" stroke="#00FFFF" stroke-width="3" />
    <line x1="20" y1="410" x2="492" y2="410" stroke="#00FFFF" stroke-width="3.5" />
    <line x1="20" y1="470" x2="492" y2="470" stroke="#00FFFF" stroke-width="4" />
    <!-- Rays -->
    <line x1="256" y1="290" x2="50" y2="492" stroke="#00FFFF" stroke-width="2" />
    <line x1="256" y1="290" x2="150" y2="492" stroke="#00FFFF" stroke-width="2" />
    <line x1="256" y1="290" x2="256" y2="492" stroke="#00FFFF" stroke-width="2" />
    <line x1="256" y1="290" x2="362" y2="492" stroke="#00FFFF" stroke-width="2" />
    <line x1="256" y1="290" x2="462" y2="492" stroke="#00FFFF" stroke-width="2" />
  </g>

  <!-- CENTER: 3.5-INCH RETRO FLOPPY DISK -->
  <g transform="translate(256, 305)">
    <!-- Cyan Chromatic Aberration Rim Shadow -->
    <path d="M -114,-106 L 86,-106 L 114,-78 L 114,114 L -114,114 Z"
          fill="none"
          stroke="#00FFFF"
          stroke-width="7"
          opacity="0.8" />

    <!-- Floppy Outer Shell (Deep Magenta Plastic) -->
    <path d="M -110,-110 L 90,-110 L 110,-90 L 110,110 L -110,110 Z"
          fill="#16052E"
          stroke="#FF00A0"
          stroke-width="5"
          stroke-linejoin="round" />

    <!-- Corner Write-Protect Tab Cutout -->
    <rect x="-98" y="90" width="16" height="12" fill="#060012" stroke="#00FFFF" stroke-width="1.5" />

    <!-- Central Circular Spindle Hub Hole (Subtle) -->
    <circle cx="0" cy="20" r="32" fill="#0C021A" stroke="#3D1263" stroke-width="3" />
    <circle cx="0" cy="20" r="14" fill="#1A0738" stroke="#FF00A0" stroke-width="2" />

    <!-- GLOSSY CHROME METAL SHUTTER (Top Half of Floppy) -->
    <g transform="translate(0, -50)">
      <rect x="-65" y="-58" width="130" height="74" rx="2" fill="url(#chrome17)" stroke="#FFFFFF" stroke-width="2.5" />
      <!-- Rectangular Head-Access Window in Shutter -->
      <rect x="-35" y="-52" width="26" height="58" rx="2" fill="#090117" stroke="#25547C" stroke-width="2" />
    </g>

    <!-- CYAN STICKER LABEL (Bottom Half of Floppy) -->
    <g transform="translate(0, 48)">
      <rect x="-85" y="-18" width="170" height="70" rx="3" fill="#031F2E" stroke="#00FFFF" stroke-width="3" />
      <!-- Grid / Header Line on Label -->
      <rect x="-85" y="-18" width="170" height="15" fill="#00FFFF" />
      <!-- Label Lines -->
      <line x1="-70" y1="12" x2="70" y2="12" stroke="#00FFFF" stroke-width="2" stroke-dasharray="8 4" />
      <line x1="-70" y1="26" x2="50" y2="26" stroke="#FF00A0" stroke-width="2" />
      <line x1="-70" y1="40" x2="30" y2="40" stroke="#00FFFF" stroke-width="2" />
      <!-- Tiny Status LED on Label -->
      <circle cx="65" cy="33" r="5" fill="#FF00A0" filter="url(#neonGlow17)" />
    </g>
  </g>



</svg>
